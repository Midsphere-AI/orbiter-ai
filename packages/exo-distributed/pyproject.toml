[project]
name = "exo-distributed"
version = "0.1.0"
description = "Distributed execution for Exo agents: Redis task queue, workers, and event streaming"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Midsphere AI" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "exo-core",
    "exo-observability",
    "redis[hiredis]>=5.0",
]

[project.urls]
Homepage = "https://github.com/midsphere-ai/exo"
Documentation = "https://midsphere-ai.github.io/exo/"
Repository = "https://github.com/midsphere-ai/exo"
Issues = "https://github.com/midsphere-ai/exo/issues"

[project.optional-dependencies]
memory = ["exo-memory"]
temporal = ["temporalio>=1.8", "cryptography>=43"]
test = ["pytest", "pytest-asyncio", "fakeredis[lua]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exo"]
