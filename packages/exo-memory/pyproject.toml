[project]
name = "exo-memory"
version = "0.1.0"
description = "Memory backends: in-memory, SQLite, Postgres, vector search"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Midsphere AI" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "exo-core",
    "exo-models",
    # aiosqlite is a hard dependency: SQLite-backed memory is a batteries-included
    # default and must work out of the box with zero extra install.
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
vector = ["chromadb>=0.6"]
# vertex embeddings are now provided by exo-models; the exo-memory[vertex] extra
# is kept as a convenience alias so existing installs don't break.
vertex = ["exo-models"]

[project.urls]
Homepage = "https://github.com/midsphere-ai/exo"
Documentation = "https://midsphere-ai.github.io/exo/"
Repository = "https://github.com/midsphere-ai/exo"
Issues = "https://github.com/midsphere-ai/exo/issues"

[tool.uv.sources]
exo-core = { workspace = true }
exo-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exo"]
