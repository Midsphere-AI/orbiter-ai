[project]
name = "exo-retrieval"
version = "0.1.0"
description = "Retrieval framework: embeddings, vector stores, and RAG pipeline for Exo agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Midsphere AI" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "exo-core>=0.1.0",
    "exo-models>=0.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
pgvector = ["asyncpg>=0.29"]
chroma = ["chromadb>=0.4"]
pdf = ["pymupdf>=1.24"]

[project.urls]
Homepage = "https://github.com/midsphere-ai/exo"
Documentation = "https://midsphere-ai.github.io/exo/"
Repository = "https://github.com/midsphere-ai/exo"
Issues = "https://github.com/midsphere-ai/exo/issues"

[tool.uv.sources]
exo-core = { workspace = true }
exo-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exo"]
