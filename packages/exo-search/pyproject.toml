[project]
name = "exo-search"
version = "0.1.0"
description = "AI-powered search engine with deep research, citations, and multi-turn chat"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Midsphere AI" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "exo-core>=0.1.0",
    "exo-models>=0.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.20"]
embeddings = ["google-genai>=1.0"]
pdf = ["pymupdf>=1.25"]

[project.scripts]
exo-search = "exo.search.__main__:main"

[project.urls]
Homepage = "https://github.com/midsphere-ai/exo"
Documentation = "https://midsphere-ai.github.io/exo/"
Repository = "https://github.com/midsphere-ai/exo"
Issues = "https://github.com/midsphere-ai/exo/issues"

[tool.uv.sources]
exo-core = { workspace = true }
exo-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exo"]
