[project]
name = "exo-skills"
version = "0.1.0"
description = "Skill source watchers for Exo hot-reloading"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Midsphere AI" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "exo-core>=0.1.0",
    "watchfiles>=1.0",
]

[project.urls]
Homepage = "https://github.com/midsphere-ai/exo"
Documentation = "https://midsphere-ai.github.io/exo/"
Repository = "https://github.com/midsphere-ai/exo"
Issues = "https://github.com/midsphere-ai/exo/issues"

[tool.uv.sources]
exo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exo_skills"]
