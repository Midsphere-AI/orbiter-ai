[project]
name = "exo-ai"
version = "0.1.0"
description = "Exo: A modern multi-agent framework (meta-package)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Midsphere AI" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "exo-core>=0.1.0",
    "exo-models>=0.1.0",
    "exo-context>=0.1.0",
    "exo-memory>=0.1.0",
    "exo-mcp>=0.1.0",
    "exo-sandbox>=0.1.0",
    "exo-observability>=0.1.0",
    "exo-eval>=0.1.0",
    "exo-retrieval>=0.1.0",
]

[project.optional-dependencies]
a2a = ["exo-a2a>=0.1.0"]
distributed = ["exo-distributed>=0.1.0"]
search = ["exo-search>=0.1.0"]
guardrail = ["exo-guardrail>=0.1.0"]
skills = ["exo-skills>=0.1.0"]
# Tracing / observability backends. Each pulls the matching extra from
# exo-observability (OTLP exporter + the vendor's native SDK where applicable).
tracing = ["exo-observability[tracing]>=0.1.0"]
langfuse = ["exo-observability[langfuse]>=0.1.0"]
langsmith = ["exo-observability[langsmith]>=0.1.0"]
phoenix = ["exo-observability[phoenix]>=0.1.0"]
braintrust = ["exo-observability[braintrust]>=0.1.0"]
all = [
    "exo-a2a>=0.1.0",
    "exo-distributed>=0.1.0",
    "exo-search>=0.1.0",
    "exo-guardrail>=0.1.0",
    "exo-skills>=0.1.0",
    "exo-observability[tracing,langfuse,langsmith,phoenix,braintrust]>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/midsphere-ai/exo"
Documentation = "https://midsphere-ai.github.io/exo/"
Repository = "https://github.com/midsphere-ai/exo"
Issues = "https://github.com/midsphere-ai/exo/issues"

[tool.uv.sources]
exo-core = { workspace = true }
exo-models = { workspace = true }
exo-context = { workspace = true }
exo-memory = { workspace = true }
exo-mcp = { workspace = true }
exo-sandbox = { workspace = true }
exo-observability = { workspace = true }
exo-eval = { workspace = true }
exo-retrieval = { workspace = true }
exo-a2a = { workspace = true }
exo-distributed = { workspace = true }
exo-search = { workspace = true }
exo-guardrail = { workspace = true }
exo-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/_exo_meta"]
